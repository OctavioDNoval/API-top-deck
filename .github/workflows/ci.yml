name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers (Docker is preinstalled on the runner).
      - name: Run tests
        run: ./mvnw -B -ntp verify

      # Without Docker the integration tests are skipped instead of failing: in CI that must never happen.
      - name: Check integration tests ran
        run: grep -q 'skipped="0"' target/surefire-reports/TEST-org.example.topdeckapi.TopDeckApiApplicationTests.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t topdeck-api:ci .
