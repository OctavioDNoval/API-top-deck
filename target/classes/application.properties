spring.application.name=TopDeckAPI
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:topdeck_database}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET}
tcg.api.key=${TCG_API_KEY}

# Email (SMTP Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_EMAIL}
spring.mail.password=${SPRING_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Thymeleaf (templates de email)
spring.thymeleaf.cache=false

# App (datos de contacto / empresa - placeholders, completar con datos reales)
app.contacto.telefono=+54 9 000 000 0000
app.contacto.email=contacto@topdeck.com
app.contacto.direccion=Direccion TopDeck
app.contacto.horario=Lunes a viernes 9:00 - 18:00
app.contacto.nombre-empresa=TopDeck
app.email.remitente=${SPRING_EMAIL}
app.email.nombre-remitente=TopDeck
app.base-url=${APP_BASE_URL:http://localhost:8080}

logging.level.root=WARN
logging.level.org.example.topdeckapi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
