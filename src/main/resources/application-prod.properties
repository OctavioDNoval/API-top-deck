# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# Self-contained on purpose: application.properties is git-ignored, so a build
# from a clean clone only has this file. Every secret comes from env vars.
spring.application.name=TopDeckAPI

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:topdeck_database}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (db/migration); Hibernate only checks the entities match it.
# Schema change = new V<n>__description.sql, never ddl-auto.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# A database created before Flyway (tables, no history) is marked as version 1 and gets V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
tcg.api.key=${TCG_API_KEY}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_EMAIL}
spring.mail.password=${SPRING_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.thymeleaf.cache=true

app.contacto.telefono=${APP_CONTACTO_TELEFONO:}
app.contacto.email=${APP_CONTACTO_EMAIL:}
app.contacto.direccion=${APP_CONTACTO_DIRECCION:}
app.contacto.horario=${APP_CONTACTO_HORARIO:}
app.contacto.nombre-empresa=TopDeck
app.email.remitente=${SPRING_EMAIL}
app.email.nombre-remitente=TopDeck
app.base-url=${APP_BASE_URL}
app.front-url=${APP_FRONT_URL}

# Comma-separated origins allowed by CORS (not needed when nginx serves front and API on one domain)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
# true only when the API is reachable exclusively through the nginx proxy (see Front-Top-Deck/nginx.conf)
app.trust-proxy=${APP_TRUST_PROXY:false}

# No request bodies, SQL parameters or security traces in production logs
logging.level.root=INFO
logging.level.org.example.topdeckapi=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=WARN
