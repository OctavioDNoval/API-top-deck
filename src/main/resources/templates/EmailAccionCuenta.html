<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title th:text="${titulo}">TopDeck</title>
	</head>
	<body
		style="
			margin: 0;
			padding: 0;
			background-color: #0a0a0a;
			font-family:
				system-ui,
				-apple-system,
				&quot;Segoe UI&quot;,
				Roboto,
				Helvetica,
				Arial,
				sans-serif;
			color: #ffffff;
		"
	>
		<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0a0a0a">
			<tr>
				<td align="center" style="padding: 24px 12px">
					<table
						width="100%"
						cellpadding="0"
						cellspacing="0"
						border="0"
						bgcolor="#1a1a1a"
						style="max-width: 600px; border: 1px solid #333333"
					>
						<tr th:if="${logoUrl != null and logoUrl != ''}">
							<td align="center" style="padding: 24px 24px 0">
								<img th:src="${logoUrl}" alt="TopDeck" width="80" style="display: block" />
							</td>
						</tr>
						<tr>
							<td style="padding: 30px 24px 10px; text-align: center">
								<h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700">
									<span th:text="${titulo}">Título</span>
								</h1>
							</td>
						</tr>
						<tr>
							<td style="padding: 8px 24px 24px; text-align: center">
								<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #b0b0b0">
									Hola
									<strong style="color: #ffffff" th:text="${nombre}">Nombre</strong>,
									<span th:text="${mensaje}">mensaje</span>
								</p>
							</td>
						</tr>
						<tr th:if="${link != null}">
							<td align="center" style="padding: 0 24px 24px">
								<a
									th:href="${link}"
									href="#"
									style="
										display: inline-block;
										padding: 14px 28px;
										background-color: #ff7a00;
										color: #0a0a0a;
										font-size: 15px;
										font-weight: 700;
										text-decoration: none;
									"
									th:text="${textoBoton}"
									>Botón</a
								>
							</td>
						</tr>
						<tr>
							<td style="padding: 0 24px 24px; text-align: center">
								<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #b0b0b0">
									<span th:text="${nota}">nota</span>
								</p>
							</td>
						</tr>
						<tr>
							<td style="padding: 24px; background-color: #0a0a0a">
								<table width="100%" cellpadding="0" cellspacing="0" border="0">
									<tr>
										<td align="center" style="padding: 4px 0">
											<span style="color: #b0b0b0; font-size: 13px" th:text="${emailContacto}"
												>contacto@topdeck.com</span
											>
										</td>
									</tr>
									<tr>
										<td align="center" style="padding: 4px 0">
											<span style="color: #b0b0b0; font-size: 13px" th:text="${telefonoContacto}"
												>telefono</span
											>
										</td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td align="center" style="padding: 16px 20px; background-color: #000000">
								<p style="margin: 0; color: #b0b0b0; font-size: 11px">TopDeck</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
