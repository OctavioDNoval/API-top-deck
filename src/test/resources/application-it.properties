# Integration tests (profile "it"). Self-contained: application.properties is git-ignored,
# so CI only has this file. The datasource comes from the Testcontainers PostgreSQL.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false

# Test-only values, not secrets
jwt.secret=integration-tests-only-secret-0123456789-abcdefghij
tcg.api.key=integration-tests
firebase.credentials-path=

# EmailService is mocked in the tests; the sender bean only needs a host to start.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=no-reply@example.com
app.email.remitente=no-reply@example.com
app.email.nombre-remitente=TopDeck
app.email.log-links=false

app.contacto.nombre-empresa=TopDeck
app.base-url=http://localhost:8080
app.front-url=http://localhost:5173
app.cors.allowed-origins=
app.trust-proxy=false

logging.level.root=WARN
logging.level.org.example.topdeckapi=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
